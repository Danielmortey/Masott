<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Masott Klassics</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <!-- Ensure this is in your <head> in admin.html -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <h1>Masott Klassics - Admin</h1>
        </div>
        <nav>
            <a href="/">Home</a>
            <a href="/gallery">Gallery</a>
        </nav>
    </header>

    <main class="admin-page">
        <!-- Login Section -->
        <section id="login-section" class="admin-panel">
            <h2>Admin Login</h2>
            <form id="login-form">
                <input type="password" id="admin-password" placeholder="Enter Password" required>
                <button type="submit" class="btn">Login</button>
            </form>
            <p id="login-error" class="error-msg"></p>
        </section>

        <!-- Dashboard Section -->
        <section id="dashboard-section" class="admin-panel" style="display: none;">
            <div class="dashboard-header">
                <h2>Manage Designs</h2>
                <button id="logout-btn" class="btn btn-outline">Logout</button>
            </div>

            <div class="upload-container">
                <h3>Upload New Design</h3>
                <form id="upload-form">
                    <div class="form-group">
                        <label>Design Name</label>
                        <input type="text" id="design-name" required>
                    </div>
                    <div class="form-group">
                        <label>Photos (Select 2 to 4 images)</label>
                        <input type="file" id="design-photos" accept="image/*" multiple required>
                        <small>Hold Ctrl/Cmd to select multiple files.</small>
                    </div>
                    <button type="submit" class="btn">Upload Design</button>
                </form>
                <p id="upload-status"></p>
            </div>

            <div class="designs-list">
                <h3>Uploaded Designs</h3>
                <table id="designs-table">
                    <thead>
                        <tr>
                            <th>Preview</th>
                            <th>Name</th>
                            <th>Photos</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Rows injected via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="/js/admin.js"></script>
</body>
</html>
